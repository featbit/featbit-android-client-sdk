name: Library and consumer contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: ['java', 'kotlin-1.9.24', 'kotlin-1.9.25', 'kotlin-2.2.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage and consume isolated Maven publication
        run: python3 tools/phase7_acceptance.py --rows ${{ matrix.consumer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.consumer }}
          path: |
            sdk/build/reports/
            build/phase7/**/report.json
            build/phase7/**/*.log
            build/phase7/**/TEST-*.xml
            build/phase7/**/build/reports/
            sdk/build/outputs/aar/
