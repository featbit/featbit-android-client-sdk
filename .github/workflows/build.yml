name: Library and consumer contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: ['java', 'kotlin-1.9.24', 'kotlin-1.9.25', 'kotlin-2.2.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override the action default, which includes the unavailable legacy tools package.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check code formatting
        run: bash gradlew spotlessCheck --console=plain
      - name: Check acceptance scripts
        run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - name: Stage and consume isolated Maven publication
        run: python3 tools/acceptance.py --rows ${{ matrix.consumer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.consumer }}
          path: |
            sdk/build/reports/
            build/acceptance/**/report.json
            build/acceptance/**/*.log
            build/acceptance/**/TEST-*.xml
            build/acceptance/**/build/reports/
            sdk/build/outputs/aar/
